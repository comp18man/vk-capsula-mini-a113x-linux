%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/amlogic,w155s2-bt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic Bluetooth chips

description:
  The W155S2 is an Amlogic Bluetooth and Wi-Fi combo chip. It works on
  the standard H4 protocol via a 4-wire UART interface, with baud rates
  up to 4 Mbps. The W155S1 has no Bluetooth enable line; its Bluetooth
  core is powered through the chip's PMU over the Wi-Fi SDIO link, which
  the supply describes.

maintainers:
  - Yang Li <yang.li@amlogic.com>

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - amlogic,w265s1-bt
              - amlogic,w265p1-bt
          - const: amlogic,w155s2-bt
      - enum:
          - amlogic,w155s1-bt
          - amlogic,w155s2-bt
          - amlogic,w265s2-bt

  clocks:
    maxItems: 1
    description: clock provided to the controller (32.768KHz)

  enable-gpios:
    maxItems: 1

  vddio-supply:
    description: VDD_IO supply regulator handle

  firmware-name:
    maxItems: 1
    description: specify the path of firmware bin to load

required:
  - compatible
  - clocks
  - vddio-supply
  - firmware-name

allOf:
  - if:
      not:
        properties:
          compatible:
            contains:
              const: amlogic,w155s1-bt
    then:
      required:
        - enable-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    bluetooth {
        compatible = "amlogic,w155s2-bt";
        clocks = <&extclk>;
        enable-gpios = <&gpio 17 GPIO_ACTIVE_HIGH>;
        vddio-supply = <&wcn_3v3>;
        firmware-name = "amlogic/aml_w155s2_bt_uart.bin";
    };

