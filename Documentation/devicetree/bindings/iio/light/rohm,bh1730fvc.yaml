%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/rohm,bh1730fvc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ROHM BH1730FVC ambient light sensor

maintainers:
  - cmp18 <comp18man@gmail.com>

description:
  Ambient light sensor with a visible and an infrared photodiode, on I2C at a
  fixed address.

properties:
  compatible:
    const: rohm,bh1730fvc

  reg:
    const: 0x29

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@29 {
            compatible = "rohm,bh1730fvc";
            reg = <0x29>;
        };
    };
