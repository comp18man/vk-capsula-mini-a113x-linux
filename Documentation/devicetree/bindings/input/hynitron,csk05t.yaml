%YAML 1.2
---
$id: http://devicetree.org/schemas/input/hynitron,csk05t.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hynitron CSK05T capacitive touch key controller

maintainers:
  - cmp18 <comp18man@gmail.com>

description:
  Five-channel capacitive touch key controller on I2C. The key state is
  polled; the INT output is reported never to produce an edge.

allOf:
  - $ref: input.yaml#

properties:
  compatible:
    const: hynitron,csk05t

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  linux,keycodes:
    minItems: 5
    maxItems: 5
    description:
      Key codes of channels 0 to 4, in channel order. Without the property
      the channels report KEY_F1 to KEY_F5.

  poll-interval:
    default: 30

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/input/input.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        keys@15 {
            compatible = "hynitron,csk05t";
            reg = <0x15>;
            reset-gpios = <&gpio 7 GPIO_ACTIVE_LOW>;
            linux,keycodes = <KEY_VOLUMEDOWN>, <KEY_MICMUTE>, <KEY_VOLUMEUP>,
                             <KEY_PROG1>, <KEY_VOICECOMMAND>;
        };
    };
